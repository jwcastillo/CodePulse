apiVersion: v1
kind: ServiceAccount
metadata:
  name: codepulse-analyzer
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codepulse-analyzer
  namespace: monitoring
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codepulse-analyzer
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codepulse-analyzer
subjects:
- kind: ServiceAccount
  name: codepulse-analyzer
  namespace: monitoring
